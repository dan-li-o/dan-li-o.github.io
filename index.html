</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(function(){
const raw = jsyaml.load(document.getElementById('data').textContent);
const START = 1991, END = 2026;
const GROUP = {city:'places',school:'places',person:'people',field:'ideas',topic:'ideas',hobby:'ideas',work:'works'};
const COLORVAR = {places:'--place',people:'--people',ideas:'--ideas',works:'--works'};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const R = s => ({1:5,2:8,3:12})[s||1];
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// nodes
const nodes = raw.map(d => ({
  ...d, group: GROUP[d.type]||'ideas', r: R(d.size),
  arrives: d.arrives || (d.type==='work' || d.note==='a human cub' ? 'born' : 'found'),
  cub: d.note==='a human cub'
}));
const byId = new Map(nodes.map(n=>[n.id,n]));
const links = [];
const seen = new Set();
nodes.forEach(n => (n.links||[]).forEach(t => {
  if(!byId.has(t)) return;
  const k = [n.id,t].sort().join('|'); if(seen.has(k)) return; seen.add(k);
  links.push({id:k, source:n.id, target:t, year: Math.max(n.year, byId.get(t).year), p:0});
}));
const adj = new Map(nodes.map(n=>[n.id,new Set()]));
links.forEach(l=>{adj.get(l.source).add(l.target); adj.get(l.target).add(l.source);});
const color = n => css(COLORVAR[n.group]);
const fillFor = n => (n.type==='school') ? css('--bg') : color(n);
const fop = n => n.type==='hobby' ? .55 : 1;
const ghost = () => css('--ghost');

// svg
const svg = d3.select('#net');
const g = svg.append('g');
const gl = g.append('g'), gn = g.append('g');
let W = innerWidth, H = innerHeight;
let userZoomed = false;
const zoom = d3.zoom().scaleExtent([.25,4]).on('zoom', e=>{ g.attr('transform', e.transform); if(e.sourceEvent) userZoomed = true; if(typeof recheckCaps==='function') recheckCaps(); if(typeof placeLabels==='function' && labelsOn) placeLabels(); });
function fit(animate){
  if(userZoomed || !live.length) return;
  const narrow = W < 760, top = narrow ? 124 : 96, bottom = narrow ? 150 : 80, side = 24;
  const xs = live.map(n=>n.x), ys = live.map(n=>n.y);
  let x0 = Math.min(...xs)-14, x1 = Math.max(...xs)+14, y0 = Math.min(...ys)-14, y1 = Math.max(...ys)+14;
  if(labelsOn) nodeSel.filter('.showlabel').each(function(d){       // keep visible labels on screen too
    const el = this.querySelector('text.lab'); if(!el || el.classList.contains('nolab') || !el.textContent) return;
    const b = el.getBBox(); x0 = Math.min(x0, d.x+b.x-4); x1 = Math.max(x1, d.x+b.x+b.width+4);
    y0 = Math.min(y0, d.y+b.y-4); y1 = Math.max(y1, d.y+b.y+b.height+4); });
  const k = Math.min((W-2*side)/(x1-x0), (H-top-bottom)/(y1-y0), 1.4);
  const tx = side + ((W-2*side) - k*(x1-x0))/2 - k*x0, ty = top + ((H-top-bottom) - k*(y1-y0))/2 - k*y0;
  const t = d3.zoomIdentity.translate(tx,ty).scale(k);
  (animate ? svg.transition().duration(700) : svg).call(zoom.transform, t);
}
svg.call(zoom).on('dblclick.zoom', null);
svg.on('click', e => { if(e.target === svg.node()) clearFocus(); });

const live = [], liveLinks = [];
const sc = () => Math.max(.6, Math.min(1, Math.min(W,H)/700));
const sim = d3.forceSimulation(live)
  .force('link', d3.forceLink(liveLinks).id(d=>d.id).distance(l=>(34 + l.source.r + l.target.r)*sc()).strength(.5))
  .force('charge', d3.forceManyBody().strength(d=>(-60 - d.r*9)*sc()))
  .force('collide', d3.forceCollide(d=>d.r+4))
  .force('ringx', d3.forceX(0).strength(0))
  .force('ringy', d3.forceY(0).strength(0))
  .force('x', d3.forceX(W/2).strength(.04))
  .force('y', d3.forceY(H/2).strength(.05))
  .alphaDecay(.02)
  .on('tick', tick)
  .on('end', ()=>fit(true));

// cluster anchors
let clustered = false;
const anchors = () => ({places:[W*.28,H*.32], people:[W*.72,H*.32], ideas:[W*.28,H*.68], works:[W*.72,H*.68]});
function setForces(){
  const a = anchors();
  sim.force('x').x(d=> clustered ? a[d.group][0] : W/2).strength(clustered ? .22 : .04);
  sim.force('y').y(d=> clustered ? a[d.group][1] : H/2).strength(clustered ? .22 : .05);
  sim.alpha(.6).restart();
}

let linkSel = gl.selectAll('line'), nodeSel = gn.selectAll('g.node');

function tick(){
  linkSel
    .attr('x1', d=>d.source.x).attr('y1', d=>d.source.y)
    .attr('x2', d=>d.source.x + (d.target.x-d.source.x)*d.p)
    .attr('y2', d=>d.source.y + (d.target.y-d.source.y)*d.p);
  nodeSel.attr('transform', d=>`translate(${d.x},${d.y})`);
  recheckCaps();
  if(labelsOn && ++labTick % 6 === 0) placeLabels();
}

function render(){
  linkSel = gl.selectAll('line').data(liveLinks, d=>d.id)
    .join(enter=>enter.append('line').attr('class','link'));
  nodeSel = gn.selectAll('g.node').data(live, d=>d.id)
    .join(enter=>{
      const e = enter.append('g').attr('class', d=>'node'+(d.type==='school'?' school':'')).attr('tabindex',0)
        .attr('role','button').attr('aria-label', d=>d.private ? d.type : d.label);
      e.append('circle').attr('class','dot').attr('r',0);
      e.filter(d=>d.cub).append('circle').attr('class','cub').attr('r',0);
      e.append('text').attr('class','lab').attr('dy', d=>-(d.r+6)).attr('text-anchor','middle')
        .text(d=> d.private ? '' : (d.short || d.label));
      e.filter(d=>(d.size||1)>=2 && !d.private).append('text').attr('class','cap')
        .attr('dy', d=>-(d.r+7)).attr('text-anchor','middle').text(d=>d.short||d.label);
      e.call(drag())
        .on('pointerenter', (ev,d)=>showTip(ev,d))
        .on('pointermove', (ev,d)=>showTip(ev,d))
        .on('pointerleave', hideTip)
        .on('click', (ev,d)=>{ev.stopPropagation(); focus(d);})
        .on('keydown', (ev,d)=>{ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault(); focus(d);} });
      return e;
    });
  sim.nodes(live);
  sim.force('link').links(liveLinks);
}

// --- arrivals ---------------------------------------------------------
function placeNear(n){
  const nb = [...adj.get(n.id)].map(id=>byId.get(id)).filter(m=>m.shown);
  if(nb.length){
    const cx = d3.mean(nb,m=>m.x), cy = d3.mean(nb,m=>m.y);
    if(n.arrives==='born'){ n.x = cx; n.y = cy; }
    else { const a = Math.random()*Math.PI*2, d = 60 + Math.random()*40; n.x = cx + Math.cos(a)*d; n.y = cy + Math.sin(a)*d; }
  } else { n.x = W/2 + (Math.random()-.5)*80; n.y = H/2 + (Math.random()-.5)*80; }
  n.vx = n.vy = 0;
}

function addNode(n, animate){
  n.shown = true; placeNear(n); live.push(n);
  const newLinks = links.filter(l => !l.shown &&
     (l.source===n.id||l.target===n.id||l.source.id===n.id||l.target.id===n.id) &&
     byId.get(typeof l.source==='object'?l.source.id:l.source).shown &&
     byId.get(typeof l.target==='object'?l.target.id:l.target).shown);
  // links should draw FROM the existing node TO the arriving one
  newLinks.forEach(l=>{
    const s = typeof l.source==='object'?l.source.id:l.source, t = typeof l.target==='object'?l.target.id:l.target;
    if(s===n.id){ l.source = t; l.target = s; }
    l.shown = true; l.p = animate ? 0 : 1; liveLinks.push(l);
  });
  render();
  const sel = nodeSel.filter(d=>d===n);
  const dot = sel.select('circle.dot'), cub = sel.select('circle.cub');
  if(!animate){
    dot.attr('r',n.r).attr('fill',fillFor(n)).attr('fill-opacity',fop(n));
    cub.attr('r',n.r+4).attr('stroke',color(n));
    return 0;
  }
  if(n.arrives==='found'){
    // ghost first, then the line reaches it, then it takes its colour
    dot.attr('fill',ghost()).transition().duration(350).attr('r',n.r*.8)
      .transition().delay(380).duration(320).attr('r',n.r).attr('fill',fillFor(n)).attr('fill-opacity',fop(n));
    growLinks(newLinks, 330, 420);
    cub.transition().delay(700).duration(300).attr('r',n.r+4).attr('stroke',color(n));
  } else {
    // born: grows out of the node it comes from
    dot.attr('fill',fillFor(n)).attr('fill-opacity',fop(n)).transition().duration(520).ease(d3.easeBackOut.overshoot(1.6)).attr('r',n.r);
    growLinks(newLinks, 0, 520);
    cub.transition().delay(300).duration(400).attr('r',n.r+4).attr('stroke',color(n));
  }
  showCaption(n, sel, n.arrives==='found' ? 650 : 250);
  sim.alpha(Math.max(sim.alpha(), .35)).restart();
  return 700;
}

function growLinks(ls, delay, dur){
  ls.forEach(l=>{
    d3.transition().delay(delay).duration(dur).ease(d3.easeCubicOut)
      .tween('grow', ()=> t => { l.p = t; tick(); });
  });
}

// --- passing captions that never overlap ------------------------------------
const activeCaps = new Set();
const overlaps = (a,b,p=4) => !(a.right+p < b.left || b.right+p < a.left || a.bottom+p < b.top || b.bottom+p < a.top);
function placeCap(el, n){
  const r = n.r, others = [...activeCaps].filter(e=>e!==el).map(e=>e.getBoundingClientRect());
  const spots = [[0,-(r+7),'middle'],[0,r+16,'middle'],[r+6,4,'start'],[-(r+6),4,'end']];
  for(const [x,y,a] of spots){
    d3.select(el).attr('dy',null).attr('x',x).attr('y',y).attr('text-anchor',a);
    const bb = el.getBoundingClientRect();
    if(!others.some(o=>overlaps(bb,o))) return true;
  }
  return false;
}
function showCaption(n, sel, delay, tries=0){
  const el = sel.select('text.cap').node(); if(!el) return;
  setTimeout(()=>{
    if(!n.shown || !playing) return;
    if(!placeCap(el,n)){ if(tries<6) showCaption(n, sel, 350, tries+1); return; }  // wait for room
    activeCaps.add(el);
    const hold = n.size===3 ? 3000 : 1500;
    d3.select(el).interrupt('cap').style('opacity',0)
      .transition('cap').duration(300).style('opacity',1)
      .transition('cap').delay(hold).duration(700).style('opacity',0)
      .on('end', ()=>activeCaps.delete(el)).on('interrupt', ()=>activeCaps.delete(el));
  }, delay);
}
let capTick = 0;
function recheckCaps(){   // nodes keep drifting; move a caption if it starts to collide
  if(++capTick % 8 || activeCaps.size < 2) return;
  const els = [...activeCaps];
  for(let i=1;i<els.length;i++){
    const bb = els[i].getBoundingClientRect();
    if(els.slice(0,i).some(e=>overlaps(bb, e.getBoundingClientRect()))){
      const n = d3.select(els[i].parentNode).datum();
      if(!placeCap(els[i], n)){ d3.select(els[i]).interrupt('cap').style('opacity',0); activeCaps.delete(els[i]); }
    }
  }
}
function clearCaps(){ nodeSel.selectAll('text.cap').interrupt('cap').style('opacity',0); activeCaps.clear(); }

function resetAll(){
  activeCaps.clear(); spreadSet = new Set(); ringCenter = null; labelsOn = false;
  sim.force('ringx').strength(0); sim.force('ringy').strength(0); sim.force('collide').radius(d=>d.r+4);
  userZoomed = false;
  live.length = 0; liveLinks.length = 0;
  nodes.forEach(n=>{n.shown=false; n.fx=n.fy=null;});
  links.forEach(l=>{l.shown=false; l.source = typeof l.source==='object'?l.source.id:l.source;
    l.target = typeof l.target==='object'?l.target.id:l.target;});
  gl.selectAll('*').remove(); gn.selectAll('*').remove();
  render(); clearFocus();
  document.getElementById('line').classList.remove('on');
}

// order within a year: found before born, then by how many links reach already-shown nodes
function yearNodes(y){
  // nodes already tied to the past come first, so things that arrive *through* someone (logic via Xingchi) follow them
  const anchored = n => [...adj.get(n.id)].filter(id=>byId.get(id).year < y).length;
  return nodes.filter(n=>n.year===y && !n.shown)
    .sort((a,b)=> (a.arrives==='born') - (b.arrives==='born') || (anchored(b)>0) - (anchored(a)>0) || (b.size||1)-(a.size||1));
}

function jumpTo(y){
  resetAll();
  for(let yy=START; yy<=y; yy++) yearNodes(yy).forEach(n=>addNode(n,false));
  current = y; setYearLabel(y);
  sim.alpha(.9).restart();
  sim.tick(120); tick(); fit(false);
  if(y>=END) finish();
}

// --- playback ---------------------------------------------------------
let current = START, playing = false, timer = null;
const yearEl = document.getElementById('year'), scrub = document.getElementById('scrub'), playBtn = document.getElementById('play');
function setYearLabel(y){ yearEl.textContent = y; scrub.value = y; }

function playYear(){
  if(!playing) return;
  if(current > END){ stop(); finish(); return; }
  setYearLabel(current);
  const ns = yearNodes(current);
  let t = 0;
  ns.forEach((n,i)=>{ setTimeout(()=>{ if(playing) addNode(n,true); }, t); t += (n.size||1)>=2 ? 420 : 170; });
  const wait = ns.length ? Math.max(650, t + 450) : 110;
  if(ns.length) setTimeout(()=>fit(true), t + 300);
  current++;
  timer = setTimeout(playYear, wait);
}
function play(){ if(current>END){ resetAll(); current = START; }
  playing = true; playBtn.textContent='❚❚'; playBtn.setAttribute('aria-label','Pause'); playYear(); }
function stop(){ playing = false; clearTimeout(timer); playBtn.textContent='▶'; playBtn.setAttribute('aria-label','Play'); }
function finish(){
  setYearLabel(END);
  document.getElementById('line').classList.add('on');
  const h = document.getElementById('help'); h.classList.add('on'); setTimeout(()=>h.classList.remove('on'), 6000);
  current = END+1; playBtn.textContent='↺'; playBtn.setAttribute('aria-label','Replay');
}

playBtn.onclick = ()=> playing ? stop() : play();
document.getElementById('skip').onclick = ()=>{ stop(); jumpTo(END); };
scrub.oninput = ()=>{ stop(); jumpTo(+scrub.value); if(+scrub.value<END){ playBtn.textContent='▶'; current = +scrub.value+1; } };

// --- spread, ring and readable labels ----------------------------------------
// Priority: Sort and rebuilds release every pin; focus, ring and chips release
// only the pins of the nodes they need to move; other pins hold.
let spreadSet = new Set(), ringCenter = null, labelsOn = false, labTick = 0;
const labelW = n => { if(n._lw == null){ const el = nodeSel.filter(d=>d===n).select('text.lab').node();
  n._lw = el ? el.getBBox().width : 0; } return n._lw; };
const collideR = d => spreadSet.has(d) ? Math.max(d.r + 4, Math.min(labelW(d)/2 + 6, 46)) : d.r + 4;
function unpin(ns){ ns.forEach(n=>{ if(n !== ringCenter){ n.fx = n.fy = null; } }); }
function setSpread(ns){
  spreadSet = new Set(ns); unpin(ns);
  sim.force('collide').radius(collideR);
  sim.velocityDecay(.55).alpha(Math.max(sim.alpha(), .35)).restart();
  labelsOn = true; setTimeout(placeLabels, 30);
  clearTimeout(setSpread._t); setSpread._t = setTimeout(()=>{ placeLabels(); fit(true); setTimeout(placeLabels, 750); }, 1100);
}
function clearSpread(){
  spreadSet = new Set(); labelsOn = false;
  if(ringCenter){ ringCenter.fx = ringCenter.fy = null; ringCenter = null; }
  sim.force('ringx').strength(0); sim.force('ringy').strength(0);
  sim.force('collide').radius(collideR);
  nodeSel.selectAll('text.lab').classed('nolab', false)
    .attr('x', null).attr('y', null).attr('dy', d=>-(d.r+6)).attr('text-anchor','middle');
  sim.velocityDecay(.4).alpha(Math.max(sim.alpha(), .3)).restart();
}
// gather a node's neighbours into a loose ring around it, keeping their current order
function gather(d){
  const nb = [...adj.get(d.id)].map(id=>byId.get(id)).filter(n=>n.shown);
  if(!nb.length) return;
  ringCenter = d; d.fx = d.x; d.fy = d.y;
  const room = d3.sum(nb, n => Math.max(2*n.r, labelW(n)) + 14);
  const R = Math.max(95, Math.min(260, room / (2*Math.PI)));
  nb.sort((a,b)=> Math.atan2(a.y-d.y, a.x-d.x) - Math.atan2(b.y-d.y, b.x-d.x));
  const start = Math.atan2(nb[0].y-d.y, nb[0].x-d.x);
  nb.forEach((n,i)=>{ const a = start + i*2*Math.PI/nb.length; n._rx = d.x + R*Math.cos(a); n._ry = d.y + R*Math.sin(a); });
  const inRing = new Set(nb);
  sim.force('ringx').x(n=> inRing.has(n) ? n._rx : 0).strength(n=> inRing.has(n) ? .6 : 0);
  sim.force('ringy').y(n=> inRing.has(n) ? n._ry : 0).strength(n=> inRing.has(n) ? .6 : 0);
  setSpread([d, ...nb]);
  sim.alpha(.7).restart();
}
// place every visible label where it touches no other label or highlighted dot; hide it if there's no room
function placeLabels(){
  if(!labelsOn) return;
  const shown = nodeSel.filter('.showlabel').data()
    .sort((a,b)=> (b===focused)-(a===focused) || (b.size||1)-(a.size||1));
  const taken = nodeSel.filter(':not(.dim)').select('circle.dot').nodes().map(e=>e.getBoundingClientRect());
  shown.forEach(n=>{
    const el = nodeSel.filter(d=>d===n).select('text.lab').node(); if(!el || !el.textContent) return;
    const r = n.r, spots = [[0,-(r+6),'middle'],[0,r+15,'middle'],[r+5,4,'start'],[-(r+5),4,'end']];
    let ok = false;
    for(const [x,y,a] of spots){
      d3.select(el).attr('dy',null).attr('x',x).attr('y',y).attr('text-anchor',a);
      const bb = el.getBoundingClientRect();
      if(!taken.some(o=>overlaps(bb,o,2))){ ok = true; taken.push(bb); break; }
    }
    d3.select(el).classed('nolab', !ok);
  });
}

// --- focus, tooltip, card ---------------------------------------------
const tip = document.getElementById('tip'), card = document.getElementById('card');
const fine = matchMedia('(pointer:fine)').matches;
function showTip(ev,d){ if(!fine || d.private) return;
  tip.textContent = d.label; tip.style.opacity = 1;
  tip.style.left = (ev.clientX+12)+'px'; tip.style.top = (ev.clientY-30)+'px'; }
function hideTip(){ tip.style.opacity = 0; }

let focused = null, catOn = null;
function focus(d){
  hideTip(); clearCaps();
  if(focused === d){ if(ringCenter === d) return; gather(d); return; }   // tap again: gather
  if(ringCenter || catOn) clearSpread();
  catOn = null; updateChips();
  focused = d;
  const nb = adj.get(d.id);
  nodeSel.classed('dim', n => n!==d && !nb.has(n.id)).classed('showlabel', n => n===d || nb.has(n.id));
  linkSel.classed('dim', l => l.source!==d && l.target!==d).classed('hot', l => l.source===d || l.target===d);
  const span = d.end && d.end!==d.year ? `${d.year}–${d.end}` : `${d.year}`;
  card.querySelector('.t').textContent = d.private ? '' : d.label;
  card.querySelector('.m').textContent = `${span} · ${({city:'place',school:'school',person:'person',field:'field',topic:'idea',hobby:'interest',work:'work'})[d.type]}`;
  card.querySelector('.n').textContent = d.note || '';
  card.querySelector('.n').style.display = d.note ? '' : 'none';
  const a = card.querySelector('a');
  if(d.url){ a.href = d.url; a.textContent = 'Open ↗'; a.style.display=''; } else a.style.display='none';
  card.classList.add('on'); document.body.classList.add('carding');
  setSpread([d, ...[...nb].map(id=>byId.get(id)).filter(n=>n.shown)]);
}
function clearFocus(){
  clearSpread();
  focused = null; nodeSel.classed('dim',false).classed('showlabel',false);
  linkSel.classed('dim',false).classed('hot',false); card.classList.remove('on'); document.body.classList.remove('carding');
  if(catOn) highlightCat(catOn);
}
card.querySelector('.x').onclick = ()=>{ catOn=null; updateChips(); clearFocus(); };

// --- categories & sort -------------------------------------------------
function highlightCat(gname){
  nodeSel.classed('dim', n=>n.group!==gname).classed('showlabel', n=>n.group===gname && (n.size||1)>=2);
  linkSel.classed('dim', l=>l.source.group!==gname && l.target.group!==gname).classed('hot',false);
  unpin(live.filter(n=>n.group===gname));
  setSpread(live.filter(n=>n.group===gname && (n.size||1)>=2));
}
function updateChips(){ document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.dataset.g===catOn)); }
document.querySelectorAll('.chip').forEach(c=>{
  const act = ()=>{ catOn = (catOn===c.dataset.g) ? null : c.dataset.g; updateChips();
    focused=null; card.classList.remove('on'); document.body.classList.remove('carding'); clearSpread();
    if(catOn) highlightCat(catOn); else { nodeSel.classed('dim',false).classed('showlabel',false); linkSel.classed('dim',false); } };
  c.onclick = act; c.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); act();} };
});
const clBtn = document.getElementById('cluster');
clBtn.onclick = ()=>{ clustered = !clustered;
  clBtn.textContent = clustered ? 'Unsort' : 'Sort'; clBtn.setAttribute('aria-pressed', clustered);
  if(ringCenter){ ringCenter = null; sim.force('ringx').strength(0); sim.force('ringy').strength(0); }
  live.forEach(n=>{ n.fx = n.fy = null; }); setForces(); };

// --- drag ----------------------------------------------------------------
function drag(){
  return d3.drag()
    .on('start', (ev,d)=>{ if(!ev.active) sim.alphaTarget(.25).restart(); d.fx=d.x; d.fy=d.y; hideTip(); })
    .on('drag', (ev,d)=>{ d.fx=ev.x; d.fy=ev.y; })
    .on('end', (ev,d)=>{ if(!ev.active) sim.alphaTarget(0); });   // stays pinned where dropped
}

addEventListener('keydown', e=>{ if(e.key==='Escape') clearFocus(); });

addEventListener('resize', ()=>{ W = innerWidth; H = innerHeight; setForces(); fit(false); });

// --- go --------------------------------------------------------------------
setForces();
if(reduce){ jumpTo(END); }
else { render(); setTimeout(play, 500); }
})();
</script>
</body>
</html>
