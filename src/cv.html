<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Dan Li</title>
<meta name="description" content="Curriculum vitae of Dan Li, philosopher of science: AI, machine learning and climate science.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f7f5f0; --ink:#26241f; --muted:#8a857b; --line:#ddd8cc; --accent:#3e7cb1; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#151513; --ink:#ece8df; --muted:#8f8a80; --line:#34322d; --accent:#6fa6d6; } }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
  .top{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
  .top .in{max-width:780px;margin:0 auto;padding:10px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .top a{color:var(--ink);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  .top a:hover{border-color:var(--muted)}
  main{max-width:780px;margin:0 auto;padding:36px 22px 72px}
  h1{font:400 40px/1.1 Newsreader,Georgia,serif;margin:0 0 6px;letter-spacing:-.01em}
  h1 + p{font:italic 400 19px/1.35 Newsreader,Georgia,serif;color:var(--muted);margin:0 0 10px}
  h2{font:600 12px/1 Inter,system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
     margin:40px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  h3{font:500 14px/1.3 Inter,system-ui,sans-serif;margin:22px 0 8px}
  p{margin:0 0 8px}
  a{color:var(--ink);text-decoration-color:var(--muted);text-underline-offset:2px}
  a:hover{color:var(--accent)}
  ul{list-style:none;margin:0;padding:0}
  li{margin:0 0 10px}
  li.ent{position:relative;padding-left:7.2em}
  li.ent > .y{position:absolute;left:0;top:0;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
  li ul{margin:4px 0 0}
  li li{margin:0 0 3px;color:var(--muted);font-size:14px;position:relative;padding-left:1em}
  li li::before{content:"–";position:absolute;left:0}
  em{font-family:Newsreader,Georgia,serif;font-size:1.06em}
  @media (max-width:560px){
    h1{font-size:32px}
    li.ent{padding-left:0}
    li.ent > .y{position:static;display:block;font-size:13px;margin-bottom:1px}
  }
  @media print{
    .top{display:none}
    html,body{background:#fff;color:#000}
    main{padding:0;max-width:none}
    a{color:#000;text-decoration:none}
    h2{color:#444;border-color:#bbb}
    li{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="top"><div class="in">
  <a href="../">← Network</a>
  __PDF__
</div></div>
<main>
__CV__
</main>
</body>
</html>
